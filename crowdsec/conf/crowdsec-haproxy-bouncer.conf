# Example bouncer config for the HAProxy Lua classic bouncer (MODE=stream, fail-open).
# Field reference (verified 2026-10-08): https://doc.crowdsec.net/u/bouncers/haproxy
# Pin the Lua files to cs-haproxy-bouncer v0.0.6 (tagged Latest stable;
# v0.0.7 is a pre-release): https://github.com/crowdsecurity/cs-haproxy-bouncer/releases
# Fetch steps: see ../../haproxy/lua/README.md
#
# DEPLOY STEP (never commit a real key):
#   1. docker compose exec crowdsec cscli bouncers add haproxy-l7
#   2. Replace ${CROWDSEC_BOUNCER_KEY} below with the printed key, on the VPS only.
#      The placeholder keeps this tracked file secret-free.
API_KEY=${CROWDSEC_BOUNCER_KEY}
# Bounce on every remediation type the bouncer understands (ban + captcha).
BOUNCING_ON_TYPE=all
# Unknown remediation kinds fall back to ban. (Fail-closed on unknown type,
# fail-open on LAPI outage: stream mode keeps serving from the cached map.)
FALLBACK_REMEDIATION=ban
# Classic Lua bouncer, stream mode: periodic decision pull, no per-request LAPI round-trip.
MODE=stream
# LAPI request timeout (ms).
REQUEST_TIMEOUT=1000
# Stream pull frequency (s).
UPDATE_FREQUENCY=10
# Health-check path excluded from bouncing so LB checks never get banned.
# Key verified present in the official template (EXCLUDE_LOCATION=). Single path
# value; re-verify match semantics against upstream v0.0.6 notes post-deploy.
EXCLUDE_LOCATION=/healthz.php
# Ban page template (path must match the lua mount in haproxy/docker-compose.yml).
# (v0.0.6: template HTML selalu diserve 200; RET_CODE dipakai untuk klien non-HTML.)
BAN_TEMPLATE_PATH=/usr/local/etc/haproxy/lua/templates/ban.html
REDIRECT_LOCATION=
RET_CODE=403
# Captcha stays unwired (no captcha provider backend in haproxy.cfg); with
# FALLBACK_REMEDIATION=ban nothing routes to captcha. Left empty on purpose.
SECRET_KEY=
SITE_KEY=
CAPTCHA_TEMPLATE_PATH=/usr/local/etc/haproxy/lua/templates/captcha.html
CAPTCHA_EXPIRATION=3600
# Stream-mode decision map. Must be writable at runtime; map ke volume
# `crowdsec-map` di haproxy/docker-compose.yml (persist antar recreate).
# Direfetch tiap UPDATE_FREQUENCY. Confirm vs upstream v0.0.6 install.sh.
MAP_PATH=/tmp/crowdsec/community_blocklist.map
