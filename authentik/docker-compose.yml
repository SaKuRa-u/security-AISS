# Identity plane: Authentik (server+worker+postgres) + LLDAP (user store).
# Mengikuti compose resmi: https://docs.goauthentik.io/compose.yml
# (tag default AUTHENTIK_TAG disamakan dengan rilis compose resmi tersebut).
# Beda dari resmi: tanpa publish port publik (masuk via HAProxy di network edge),
# tanpa mount docker.sock (tidak pakai outpost), tambah LLDAP.
services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    container_name: authentik-postgresql
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
    volumes:
      - authentik_db:/var/lib/postgresql/data
    networks: [authentik-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      retries: 5
      start_period: 20s
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"

  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3}
    container_name: authentik-server
    restart: unless-stopped
    command: server
    env_file:
      - ./.env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    volumes:
      # Storage path resmi /data (wajib untuk upload file managed).
      # Dibagi server + worker. Jangan ganti ke /media.
      - authentik_data:/data
    # Lifeline lokal saja (debug darurat via SSH tunnel); publik via HAProxy.
    ports:
      - "127.0.0.1:9000:9000"
    networks: [authentik-db, edge]
    depends_on:
      postgresql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"

  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3}
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    user: root
    env_file:
      - ./.env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    volumes:
      # Storage path resmi /data (wajib untuk upload file managed).
      # Dibagi server + worker. Jangan ganti ke /media.
      - authentik_data:/data
    # edge: WAJIB — task ldap_sync jalan di worker dan harus mencapai lldap:3890
    networks: [authentik-db, edge]
    depends_on:
      postgresql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"

  lldap:
    image: ${LLDAP_IMAGE:-lldap/lldap:stable}
    container_name: lldap
    restart: unless-stopped
    volumes:
      - lldap_data:/data
    environment:
      LLDAP_LDAP_BASE_DN: ${LLDAP_BASE_DN:-dc=cloudferdi,dc=web,dc=id}
      LLDAP_LDAP_USER_PASS: ${LLDAP_ADMIN_PASS:?lldap admin password required}
      LLDAP_JWT_SECRET: ${LLDAP_JWT_SECRET:?lldap jwt secret required}
      LLDAP_KEY_SEED: ${LLDAP_KEY_SEED:?lldap key seed required}
    # Admin UI lokal saja; LDAP (3890) internal untuk Authentik LDAP Source.
    ports:
      - "127.0.0.1:17170:17170"
    networks: [edge]
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"

volumes:
  authentik_db:
  authentik_data:
  lldap_data:

networks:
  authentik-db:
    driver: bridge
  edge:
    external: true
