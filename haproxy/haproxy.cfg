# HAProxy 3.4 LTS — edge reverse proxy (NetBird pertama, proyek lain menyusul).
# Backend via nama container di network eksternal `edge`.
# TLS: certbot di host (Let's Encrypt) -> gabung fullchain+key ke certs/netbird.pem.
# Ref NetBird: https://docs.netbird.io/selfhosted/external-reverse-proxy#combined-container-setup-v0-65-0
# Ref HAProxy 3.4 (LTS s/d 2031-Q2): https://docs.haproxy.org/3.4/intro.html

global
    log stdout format raw local0
    # Dual-log: keep stdout (json-file driver) + UDP syslog to CrowdSec acquis
    # (VPS/crowdsec/acquis.d/haproxy.yaml, type haproxy).
    # Format rfc5424 WAJIB (bukan default RFC3164): parser syslog CrowdSec
    # menolak timestamp hari 1-digit RFC3164 ("Oct  9", spasi ganda) dengan
    # "unrecognized syslog message" -> 0% parsed. Terbukti via uji sintetik.
    # Level info: buang debug ocehan lua-bouncer, loloskan httplog (info).
    # Best-effort: log delivery failure never blocks traffic (fail-open).
    # Hostname resolves via Docker embedded DNS on network `edge`.
    # Ref: https://www.haproxy.com/documentation/haproxy-enterprise/administration/logs ("log rsyslog:514 local0")
    log crowdsec:514 format rfc5424 local0 info
    # CrowdSec L7 bouncer (Lua classic, MODE=stream, fail-open).
    # Pin: cs-haproxy-bouncer v0.0.6 (Latest stable; v0.0.7 pre-release).
    # Ref: https://doc.crowdsec.net/u/bouncers/haproxy
    # lua/crowdsec.lua is a fail-open stub until pinned upstream (see lua/README.md).
    # Wajib eksplisit (default ambigu "pre-3.1-bug" memicu WARNING tiap -c).
    tune.lua.bool-sample-conversion normal
    lua-prepend-path /usr/local/etc/haproxy/lua/?.lua
    lua-load /usr/local/etc/haproxy/lua/crowdsec.lua
    setenv CROWDSEC_CONFIG /etc/crowdsec/bouncers/crowdsec-haproxy-bouncer.conf
    maxconn 4000
    ssl-default-bind-options ssl-min-ver TLSv1.2
    tune.ssl.default-dh-param 2048

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 1d
    timeout server 1d
    timeout tunnel 1d
    timeout http-request 10s
    timeout http-keep-alive 10s

# DNS runtime via Docker embedded DNS — HAProxy boleh start walau backend
# (netbird-*) belum ada; server ditandai DOWN sampai resolve + check lolos.
# Pola resmi: https://www.haproxy.com/blog/haproxy-on-docker-swarm-load-balancing-and-dns-service-discovery
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold valid 10s

frontend fe_http
    bind *:80
    http-request redirect scheme https code 301

frontend fe_https
    # ALPN h2 wajib untuk gRPC NetBird
    bind *:443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1

    # Rate limit L7 instan (per-IP): >200 req/10s -> 429. Beda dengan
    # CrowdSec (ban ber-ingatan): ini murah & seketika, melindungi SPOA/LAPI.
    # Slot sc1 + tabel sendiri: tidak menyentuh tabel captcha bouncer (sc0).
    # Ambang longgar: 1 IP publik bisa = 1 site NAT. Terbukti: 200x200 + 100x429.
    http-request track-sc1 src table ratelimit
    acl flood_abuse sc_http_req_rate(1,ratelimit) gt 200
    http-request deny deny_status 429 if flood_abuse

    # WAF Coraza (SPOA): inspeksi request HTTP saja.
    # gRPC/WS dikecualikan (payload biner, rawan false-positive CRS).
    # Aset publik (/image-proxy.php, /assets/) dikecualikan: key allowlist
    # ketat di PHP (SSRF tertutup), hemat RTT SPOA per gambar. Bouncer
    # CrowdSec tetap cek semua IP (tidak ikut skip ini).
    filter spoe engine coraza config /usr/local/etc/haproxy/coraza-spoe.cfg
    acl skip_waf path_beg /signalexchange.SignalExchange/ /management.ManagementService/ /management.ProxyService/ /relay /ws-proxy/ /image-proxy.php /assets/
    http-request set-var(txn.coraza.app) str(edge) unless skip_waf
    http-request send-spoe-group coraza coraza-req unless skip_waf
    http-request deny deny_status 403 if { var(txn.coraza.action) -m str deny }

    # CrowdSec L7 bouncer: IP check vs stream decisions (fail-open on LAPI outage).
    # AFTER Coraza; skip_waf gRPC/WS exceptions untouched (bouncer still checks every IP).
    # Action/service names per https://doc.crowdsec.net/u/bouncers/haproxy
    stick-table type ip size 10k expire 30m
    http-request lua.crowdsec_allow
    http-request track-sc0 src if { var(req.remediation) -m str "captcha-allow" }
    http-request redirect location %[var(req.redirect_uri)] if { var(req.remediation) -m str "captcha-allow" }
    http-request use-service lua.reply_captcha if { var(req.remediation) -m str "captcha" }
    http-request use-service lua.reply_ban if { var(req.remediation) -m str "ban" }

    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]

    # Ganti jika AUTH_DOMAIN berubah (lihat authentik/.env)
    acl is_auth hdr(host) -i auth.cloudferdi.web.id
    acl is_app hdr(host) -i app.cloudferdi.web.id

    acl is_grpc path_beg /signalexchange.SignalExchange/ /management.ManagementService/ /management.ProxyService/
    acl is_ws path_beg /relay /ws-proxy/
    acl is_backend_http path_beg /api/ /oauth2/

    use_backend be_authentik if is_auth
    use_backend be_app if is_app
    use_backend be_netbird_grpc if is_grpc
    use_backend be_netbird_ws if is_ws
    use_backend be_netbird_http if is_backend_http
    default_backend be_dashboard

# gRPC native: backend h2c (HTTP/2 cleartext)
backend be_netbird_grpc
    mode http
    http-request set-header X-Forwarded-For %[src]
    server netbird netbird-server:80 check proto h2 resolvers docker init-addr none resolve-prefer ipv4

# WebSocket: relay + ws-proxy
backend be_netbird_ws
    mode http
    option http-server-close
    http-request set-header Upgrade %[req.hdr(Upgrade)] if { req.hdr(Upgrade) -m found }
    http-request set-header Connection "Upgrade" if { req.hdr(Upgrade) -m found }
    http-request set-header Host %[req.hdr(Host)]
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-For %[src]
    server netbird netbird-server:80 check resolvers docker init-addr none resolve-prefer ipv4

# REST API + OAuth2 IdP
backend be_netbird_http
    mode http
    http-request set-header Host %[req.hdr(Host)]
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-For %[src]
    server netbird netbird-server:80 check resolvers docker init-addr none resolve-prefer ipv4

# Dashboard (catch-all)
backend be_dashboard
    mode http
    http-request set-header Host %[req.hdr(Host)]
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-For %[src]
    server dashboard netbird-dashboard:80 check resolvers docker init-addr none resolve-prefer ipv4

# Authentik (SSO/IAM)
backend be_authentik
    mode http
    http-request set-header Host %[req.hdr(Host)]
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-For %[src]
    server authentik authentik-server:9000 check resolvers docker init-addr none resolve-prefer ipv4

# App di node via overlay NetBird (IP literal: tanpa resolvers, langsung dipakai).
# Syarat: client NetBird jalan di VPS + MASQUERADE host (lihat README).
backend be_app
    mode http
    balance roundrobin
    timeout check 5s
    default-server inter 5s rise 2 fall 3 slowstart 30s
    cookie SERVERID insert indirect nocache
    option httpchk GET /healthz.php
    http-check expect status 200
    http-request set-header Host %[req.hdr(Host)]
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    server node1 100.101.136.77:8080 check cookie node1
    server node2 100.101.133.237:8080 check cookie node2

# Coraza WAF (SPOA, TCP). Fail-open: kalau SPOA mati, request lolos tanpa
# inspeksi (ketersediaan didahulukan; set-on-error hanya mencatat error).
backend coraza-spoa
    mode tcp
    option spop-check
    server spoa coraza-spoa:9000 check resolvers docker init-addr none resolve-prefer ipv4

# Tabel rate-limit (tanpa server; hanya state).
backend ratelimit
    stick-table type ip size 100k expire 1m store http_req_rate(10s)

# CrowdSec LAPI (stream decisions for the Lua classic bouncer, MODE=stream).
# Docker DNS like other backends; fail-open: bouncer serves from cached map
# when LAPI is unreachable (start CrowdSec before HAProxy, see crowdsec README).
backend crowdsec
    mode http
    server crowdsec crowdsec:8080 check resolvers docker init-addr none resolve-prefer ipv4
