# NetBird Combined Server Configuration
# Generated mengikuti template resmi getting-started.sh (mode reverse proxy eksternal / manual).
# Ganti semua nilai CHANGEME sebelum docker compose up.
# Ref: https://docs.netbird.io/selfhosted/external-reverse-proxy#combined-container-setup-v0-65-0
# Contoh lengkap: https://raw.githubusercontent.com/netbirdio/netbird/main/combined/config.yaml.example

server:
  listenAddress: ":80"
  # Format: https://<domain>:443 untuk produksi, http://<ip> untuk mode use-ip
  exposedAddress: "https://netbirdoverlay.cloudferdi.web.id:443"
  stunPorts:
    - 3478
  metricsPort: 9090
  healthcheckAddress: ":9000"
  logLevel: "info"
  logFile: "console"

  # Generate: openssl rand -base64 32 | tr -d '='
  authSecret: "CHANGEME-generate-openssl-rand-base64-32-tanpa-padding"

  dataDir: "/var/lib/netbird"

  auth:
    issuer: "https://netbirdoverlay.cloudferdi.web.id/oauth2"
    signKeyRefreshEnabled: true
    # Generate: openssl rand -base64 32
    # ponytail: placeholder secret, wajib diganti sebelum produksi
    sessionCookieEncryptionKey: "CHANGEME-generate-openssl-rand-base64-32"
    dashboardRedirectURIs:
      - "https://netbirdoverlay.cloudferdi.web.id/nb-auth"
      - "https://netbirdoverlay.cloudferdi.web.id/nb-silent-auth"
    cliRedirectURIs:
      - "http://localhost:53000/"

  reverseProxy:
    trustedHTTPProxies: []
    # Isi dengan subnet network `edge` (HAProxy jalan sebagai container).
    # Cari subnet: docker network inspect edge --format "{{(index .IPAM.Config 0).Subnet}}"
    # Contoh: ["172.18.0.0/16"] — sesuaikan dengan output perintah di atas.
    # Kosong = semua sumber dipercaya (lab saja, tidak disarankan produksi).
    trustedPeers: [172.18.0.0/16]

  store:
    engine: "sqlite"
    # Generate: openssl rand -base64 32 (pertahankan padding '=' di akhir)
    encryptionKey: "CHANGEME-generate-openssl-rand-base64-32-pertahankan-padding-="
